<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="../assets/img/logo.png" />
  <title>Admin Login - SmartKrushi</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f766e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      overflow: hidden;
      max-width: 440px;
      width: 100%;
    }
    .login-header {
      background: linear-gradient(87deg, #1e293b 0, #0f766e 100%);
      color: white;
      padding: 30px 25px;
      text-align: center;
    }
    .form-control { border-radius: 10px; height: 46px; }
    .btn-admin {
      background: linear-gradient(87deg, #0f766e 0, #10b981 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      padding: 12px;
    }
    .btn-admin:hover { color: white; opacity: 0.95; }
  </style>
</head>
<body>

  <div class="login-card mx-3">
    <div class="login-header">
      <div class="mb-2"><i class="fas fa-user-shield fa-3x text-warning"></i></div>
      <h4 class="font-weight-bold mb-1">SmartKrushi Admin</h4>
      <p class="small mb-0 text-white-50">Central Agricultural Marketplace & Advisory Control</p>
    </div>

    <div class="p-4">
      <div id="loginAlert" class="alert alert-danger d-none small"></div>

      <form onsubmit="return handleAdminLogin(event)">
        <div class="form-group">
          <label class="small font-weight-bold text-muted">Admin Username / Email</label>
          <div class="input-group">
            <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-user-cog"></i></span></div>
            <input type="text" id="adminUser" class="form-control" placeholder="Enter admin username" autocomplete="off" required>
          </div>
        </div>

        <div class="form-group">
          <label class="small font-weight-bold text-muted">Password</label>
          <div class="input-group">
            <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-lock"></i></span></div>
            <input type="password" id="adminPass" class="form-control" placeholder="Enter admin password" autocomplete="off" required>
          </div>
        </div>

        <button type="submit" class="btn btn-admin btn-block shadow-sm mt-3">
          <i class="fas fa-sign-in-alt mr-1"></i> Login to Admin Panel
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="../index.html" class="small text-secondary font-weight-bold"><i class="fas fa-arrow-left mr-1"></i> Back to Home Portal</a>
      </div>
    </div>
  </div>

  <script src="../js/smart_krushi_core.js"></script>
  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      const res = SmartKrushi.adminLogin(u, p);
      if (res.success) {
        window.location.href = 'adashboard.html';
      } else {
        const al = document.getElementById('loginAlert');
        al.textContent = res.message;
        al.classList.remove('d-none');
      }
      return false;
    }
  </script>
</body>
</html>

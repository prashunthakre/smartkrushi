<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/img/logo.png" />
  <title>Customer Login - SmartKrushi</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #0b3d2e 45%, #1f9d8a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    .auth-card {
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      overflow: hidden;
      width: min(100%, 480px);
    }
    .auth-header {
      background: linear-gradient(90deg, #1d9c7b, #2db39d);
      color: white;
      padding: 26px 24px;
      text-align: center;
    }
    .auth-body { padding: 28px 28px 20px; }
  </style>
</head>
<body>
  <!-- Top Left Home Button -->
  <a href="../index.html" class="btn btn-sm text-white font-weight-bold" style="position: fixed; top: 20px; left: 20px; z-index: 1000; border-radius: 30px; padding: 8px 20px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.4); text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.25);">
      <i class="fas fa-home mr-1 text-success"></i> Home
  </a>

  <div class="auth-card">
    <div class="auth-header">
      <h3 class="mb-1 font-weight-bold"><i class="fas fa-shopping-basket mr-2"></i>Customer Portal</h3>
      <small>SmartKrushi Direct F2C Market Access</small>
    </div>
    <div class="auth-body">
      <div id="loginAlert" class="alert d-none" role="alert"></div>

      <form id="customerLoginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="small font-weight-bold">Email or Mobile Number</label>
          <input type="text" id="custEmail" class="form-control" placeholder="name@example.com or 10-digit mobile" required />
        </div>
        <div class="form-group">
          <label class="small font-weight-bold">Password</label>
          <input type="password" id="custPassword" class="form-control" placeholder="Enter password" required />
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" />
            <label class="form-check-label small" for="rememberMe">Remember me</label>
          </div>
          <a href="javascript:void(0)" class="small text-primary font-weight-bold" onclick="openCustResetModal()">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-success btn-block font-weight-bold py-2">Sign In</button>
        <button type="button" class="btn btn-outline-primary btn-block btn-sm mt-2 font-weight-bold" onclick="openCustOtpModal()">
          <i class="fas fa-mobile-alt mr-1"></i> Login with 6-Digit OTP
        </button>

        <div class="text-center mt-3">
          <small><a href="cregister.html" class="text-success font-weight-bold">New user? Create customer account</a></small>
        </div>
        <div class="text-center mt-2 pt-2 border-top">
          <small><a href="../index.html" class="text-muted font-weight-bold"><i class="fas fa-arrow-left mr-1"></i> Back to Homepage</a></small>
        </div>
      </form>
    </div>
  </div>

  <!-- Customer OTP Modal -->
  <div id="custOtpModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.7);z-index:9999;align-items:center;justify-content:center;padding:15px;">
    <div class="bg-white rounded p-4 shadow-lg" style="max-width:420px;width:100%;border-radius:16px !important;">
      <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
        <h6 class="font-weight-bold mb-0"><i class="fas fa-shield-alt text-success mr-1"></i> Customer 6-Digit OTP Login</h6>
        <button class="btn btn-sm btn-light" onclick="document.getElementById('custOtpModal').style.display='none'">&times;</button>
      </div>
      <div id="custOtpAlert" class="alert d-none small py-2"></div>
      <div class="form-group">
        <label class="small font-weight-bold">Registered Email or Mobile</label>
        <input type="text" id="custOtpIdent" class="form-control form-control-sm" placeholder="e.g. ananya.sharma@example.com" />
      </div>
      <button class="btn btn-primary btn-sm btn-block font-weight-bold" onclick="sendCustOtp()">
        <i class="fas fa-paper-plane mr-1"></i> Generate & Send 6-Digit OTP
      </button>
      <div id="custOtpVerifyBox" class="d-none mt-3 pt-3 border-top">
        <label class="small font-weight-bold">Enter 6-Digit OTP</label>
        <input type="text" id="custOtpCode" class="form-control text-center font-weight-bold mb-2" maxlength="6" style="letter-spacing:5px;" />
        <button class="btn btn-success btn-sm btn-block font-weight-bold" onclick="verifyCustOtp()">Verify OTP & Login</button>
      </div>
    </div>
  </div>

  <!-- Customer Forgot Password Card Modal (Step-by-Step: Email -> Verify OTP (10 Min) -> New & Confirm Password -> Change Password) -->
  <div id="custResetModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.7);z-index:9999;align-items:center;justify-content:center;padding:15px;">
    <div class="bg-white rounded p-4 shadow-lg" style="max-width:480px;width:100%;max-height:90vh;overflow-y:auto;border-radius:16px !important;">
      <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
        <h6 class="font-weight-bold mb-0"><i class="fas fa-key text-warning mr-1"></i> Forgot Password Card (Customer)</h6>
        <button class="btn btn-sm btn-outline-danger font-weight-bold" onclick="document.getElementById('custResetModal').style.display='none'">
          <i class="fas fa-times mr-1"></i> Close Card
        </button>
      </div>
      <div class="d-flex justify-content-end align-items-center mb-2">
        <span class="badge badge-warning px-2 py-1" id="custResetTimerBadge">
          <i class="far fa-clock mr-1"></i> OTP Validity: 10:00
        </span>
      </div>
      <div id="custResetAlert" class="alert d-none small py-2"></div>

      <!-- Step 1: Enter Registered Email ID -->
      <div class="form-group">
        <label class="small font-weight-bold">1. Enter Registered Email ID</label>
        <div class="input-group input-group-sm">
          <input type="text" id="custResetIdent" class="form-control" placeholder="e.g. ananya.sharma@example.com" />
          <div class="input-group-append">
            <button type="button" class="btn btn-primary font-weight-bold" onclick="requestCustResetOTP()">
              <i class="fas fa-paper-plane mr-1"></i> Send OTP
            </button>
          </div>
        </div>
      </div>

      <!-- Step 2: Enter OTP Below Email & Click Verify OTP -->
      <div id="custResetOtpBox" class="form-group d-none p-3 rounded border bg-light">
        <label class="small font-weight-bold text-dark">2. Enter 6-Digit OTP (Valid for 10 Minutes)</label>
        <div class="input-group input-group-sm">
          <input type="text" id="custResetOtpInput" class="form-control text-center font-weight-bold" maxlength="6" placeholder="Enter 6-Digit OTP" style="letter-spacing:5px;" />
          <div class="input-group-append">
            <button type="button" class="btn btn-primary font-weight-bold" onclick="verifyCustResetOTP()">
              <i class="fas fa-check-circle mr-1"></i> Verify OTP
            </button>
          </div>
        </div>
      </div>

      <!-- Step 3: Unlocked After OTP Verification -> New Password, Confirm Password & Change Password -->
      <div id="custResetPasswordFieldsBox" class="d-none pt-2 border-top">
        <div class="form-group">
          <label class="small font-weight-bold">3. New Password</label>
          <input type="password" id="custResetPass" class="form-control form-control-sm" placeholder="Enter New Password (min 4 chars)" />
        </div>
        <div class="form-group">
          <label class="small font-weight-bold">4. Confirm Password</label>
          <input type="password" id="custResetConfirmPass" class="form-control form-control-sm" placeholder="Re-enter Confirm Password" />
        </div>
        <button class="btn btn-warning btn-sm btn-block font-weight-bold" onclick="resetCustPassword()">
          <i class="fas fa-save mr-1"></i> Change Password
        </button>
      </div>

      <div class="text-center mt-3 pt-2 border-top">
        <button type="button" class="btn btn-sm btn-link text-muted font-weight-bold" onclick="document.getElementById('custResetModal').style.display='none'">
          <i class="fas fa-arrow-left mr-1"></i> Cancel & Back to Sign In
        </button>
      </div>
    </div>
  </div>

  <script src="../js/smart_krushi_core.js?v=20261030_03"></script>
  <script>
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('custEmail').value.trim();
      const password = document.getElementById('custPassword').value;

      const result = SmartKrushi.auth.login(email, password, 'customer');
      const alertBox = document.getElementById('loginAlert');

      if (result.success) {
        alertBox.className = 'alert alert-success';
        alertBox.innerHTML = '<i class="fas fa-check-circle"></i> ' + result.message + ' Redirecting...';
        alertBox.classList.remove('d-none');
        setTimeout(() => window.location.href = 'cbuy_crops.html', 900);
      } else {
        alertBox.className = 'alert alert-danger';
        alertBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + result.message;
        alertBox.classList.remove('d-none');
      }
      return false;
    }

    function openCustOtpModal() {
      document.getElementById('custOtpModal').style.display = 'flex';
    }
    function openCustResetModal() {
      document.getElementById('custResetModal').style.display = 'flex';
    }

    function sendCustOtp() {
      const ident = document.getElementById('custOtpIdent').value;
      const res = SmartKrushi.auth.sendOtp(ident, 'customer');
      const al = document.getElementById('custOtpAlert');
      if (res.success) {
        al.className = 'alert alert-success small py-2';
        al.innerHTML = `<i class="fas fa-envelope-open-text mr-1"></i> 6-Digit OTP sent to <strong>${res.email}</strong>.<br><span class="badge badge-primary mt-1" style="font-size:13px;letter-spacing:2px;">OTP: ${res.otp}</span>`;
        al.classList.remove('d-none');
        document.getElementById('custOtpCode').value = res.otp;
        document.getElementById('custOtpVerifyBox').classList.remove('d-none');
        document.getElementById('custOtpCode').focus();
      } else {
        al.className = 'alert alert-danger small py-2';
        al.textContent = res.message;
        al.classList.remove('d-none');
      }
    }

    function verifyCustOtp() {
      const ident = document.getElementById('custOtpIdent').value;
      const code = document.getElementById('custOtpCode').value;
      const res = SmartKrushi.auth.verifyOtpAndLogin(ident, code, 'customer');
      const al = document.getElementById('custOtpAlert');
      if (res.success) {
        document.getElementById('custOtpModal').style.display = 'none';
        window.location.href = 'cbuy_crops.html';
      } else {
        al.className = 'alert alert-danger small py-2';
        al.textContent = res.message;
        al.classList.remove('d-none');
      }
    }

    let custResetTimer = null;
    function startCustResetCountdown(seconds) {
      if (custResetTimer) clearInterval(custResetTimer);
      let rem = seconds;
      const badge = document.getElementById('custResetTimerBadge');
      custResetTimer = setInterval(() => {
        rem--;
        if (rem <= 0) {
          clearInterval(custResetTimer);
          if (badge) badge.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> OTP Expired (10:00)';
          return;
        }
        const m = String(Math.floor(rem / 60)).padStart(2, '0');
        const s = String(rem % 60).padStart(2, '0');
        if (badge) badge.innerHTML = `<i class="far fa-clock mr-1"></i> OTP Validity: ${m}:${s}`;
      }, 1000);
    }

    function requestCustResetOTP() {
      const ident = document.getElementById('custResetIdent').value;
      const al = document.getElementById('custResetAlert');
      const res = SmartKrushi.auth.sendPasswordResetOtp(ident, 'customer');
      if (res.success) {
        al.className = 'alert alert-info small py-2';
        al.innerHTML = `<i class="fas fa-envelope-open-text mr-1"></i> 6-Digit Password Reset OTP sent to <strong>${res.email}</strong>.<br><span class="badge badge-info mt-1" style="font-size:13px;letter-spacing:2px;">OTP: ${res.otp}</span>`;
        al.classList.remove('d-none');
        document.getElementById('custResetOtpBox').classList.remove('d-none');
        document.getElementById('custResetPasswordFieldsBox').classList.add('d-none');
        document.getElementById('custResetOtpInput').value = res.otp;
        document.getElementById('custResetOtpInput').readOnly = false;
        document.getElementById('custResetOtpInput').focus();
        startCustResetCountdown(600);
      } else {
        al.className = 'alert alert-danger small py-2';
        al.textContent = res.message;
        al.classList.remove('d-none');
      }
    }

    function verifyCustResetOTP() {
      const ident = document.getElementById('custResetIdent').value;
      const enteredOtp = document.getElementById('custResetOtpInput').value;
      const al = document.getElementById('custResetAlert');
      const res = SmartKrushi.auth.verifyPasswordResetOtp(ident, enteredOtp, 'customer');
      if (res.success) {
        al.className = 'alert alert-success small py-2';
        al.innerHTML = '<i class="fas fa-check-circle mr-1"></i> ' + res.message;
        al.classList.remove('d-none');
        document.getElementById('custResetOtpInput').readOnly = true;
        document.getElementById('custResetPasswordFieldsBox').classList.remove('d-none');
        document.getElementById('custResetPass').focus();
      } else {
        al.className = 'alert alert-danger small py-2';
        al.textContent = res.message;
        al.classList.remove('d-none');
      }
    }

    function resetCustPassword() {
      const ident = document.getElementById('custResetIdent').value;
      const enteredOtp = document.getElementById('custResetOtpInput').value;
      const pass = document.getElementById('custResetPass').value;
      const confirmPass = document.getElementById('custResetConfirmPass').value;
      const previewBox = document.getElementById('custResetMailPreview');
      const al = document.getElementById('custResetAlert');

      if (!pass || !confirmPass) {
        al.className = 'alert alert-danger small py-2';
        al.textContent = 'Please fill both New Password and Confirm Password.';
        al.classList.remove('d-none');
        return;
      }
      if (pass !== confirmPass) {
        al.className = 'alert alert-danger small py-2';
        al.textContent = 'New Password and Confirm Password do not match! Please enter the same password.';
        al.classList.remove('d-none');
        return;
      }

      const res = SmartKrushi.auth.resetPassword(ident, pass, 'customer', enteredOtp, confirmPass);
      if (res.success) {
        if (custResetTimer) clearInterval(custResetTimer);
        al.className = 'alert alert-success small py-2';
        al.innerHTML = '<i class="fas fa-check-circle mr-1"></i> ' + res.message + ' Redirecting to Login Page...';
        al.classList.remove('d-none');
        setTimeout(() => {
          window.location.href = 'clogin.html?password_changed=' + encodeURIComponent(res.email || ident);
        }, 900);
      } else {
        al.className = 'alert alert-danger small py-2';
        al.textContent = res.message;
        al.classList.remove('d-none');
      }
    }

    // Check URL query for post-registration or post-password-reset redirect
    (function initCustUrlAlerts() {
      const params = new URLSearchParams(window.location.search);
      const regEmail = params.get('registered');
      const pwdEmail = params.get('password_changed');
      const alertBox = document.getElementById('loginAlert');
      if (regEmail) {
        document.getElementById('custEmail').value = regEmail;
        alertBox.className = 'alert alert-success small';
        alertBox.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Registration Completed & Verified! Please sign in with your email and password.';
        alertBox.classList.remove('d-none');
      } else if (pwdEmail) {
        document.getElementById('custEmail').value = pwdEmail;
        alertBox.className = 'alert alert-success small';
        alertBox.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Password Changed Successfully! Please sign in with your new password.';
        alertBox.classList.remove('d-none');
      }
    })();

    function checkAlreadyLoggedIn() {
      if (SmartKrushi.auth.isLoggedIn() && SmartKrushi.auth.getCurrentUser().type === 'customer') {
        window.location.replace('cbuy_crops.html');
      }
    }
    checkAlreadyLoggedIn();
    window.addEventListener('pageshow', function(event) {
      checkAlreadyLoggedIn();
    });
  </script>
</body>
</html>
